# Locked environment for the NVIDIA Jetson AGX Thor Developer Kit (sm_110, CUDA 13.4).
# It installs the parent alpamayo2-edge checkout in editable mode and replaces the
# x86 pins (torch 2.8.0, flash-attn 2) with cu134 PyTorch and FlashAttention 4.
# See README.md in this directory.

[project]
name = "alpamayo2-edge-thor-devkit"
version = "0.1.0"
description = "Alpamayo 2 Edge environment for the NVIDIA Jetson AGX Thor Developer Kit"
requires-python = "==3.12.*"
dependencies = [
  "alpamayo2-edge",
  "torch==2.15.0+cu134",
  "torchvision==0.29.2+cu134",
  "flashinfer-python==0.7.3",
  "flashinfer-cubin==0.7.3",
  "flashinfer-jit-cache-sm110a==0.7.3+cu134",
  # Tools installed alongside the validated environment.
  "truststore",
  "wheel",
]

[project.optional-dependencies]
# The root project's extras, with FlashAttention 4 (sm_110) in place of FlashAttention 2.
# [cu13] pulls nvidia-cutlass-dsl's CUDA 13 libraries.
flash = ["flash-attn-4[cu13]==4.0.0b38"]
dataset = ["physical-ai-av==0.2.0"]
notebook = ["physical-ai-av==0.2.0", "jupyter>=1.1.1", "matplotlib>=3.10"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.9"]

[tool.uv]
package = false
# Thor only: never resolve for Windows, macOS or x86.
environments = ["sys_platform == 'linux' and platform_machine == 'aarch64'"]
required-environments = ["sys_platform == 'linux' and platform_machine == 'aarch64'"]
# The parent project pins torch==2.8.0 / torchvision==0.23.0 for x86 + FlashAttention 2.
override-dependencies = ["torch==2.15.0+cu134", "torchvision==0.29.2+cu134"]
