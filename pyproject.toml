[project]
name = "alpamayo2-edge"
version = "0.1.0"
description = "PyTorch inference for Alpamayo 2 Edge"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "torch==2.8.0",
  "torchvision==0.23.0",
  "transformers==5.17.0",
  "accelerate>=1.12.0",
  "huggingface-hub>=1.0,<2",
  "safetensors>=0.8.0",
  "einops>=0.8.1",
  "hydra-core>=1.3.2",
  "numpy>=2.0",
  "pillow>=11.0",
  "scipy>=1.16.0",
  "colorlog>=6.0",
]

[project.optional-dependencies]
flash = ["flash-attn==2.8.3"]
dataset = ["physical-ai-av==0.2.0"]

[project.scripts]
alpamayo2-edge = "alpamayo2_edge.inference:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.9"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alpamayo2_edge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-p", "no:cacheprovider"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
